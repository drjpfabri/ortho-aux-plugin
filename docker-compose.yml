services:
  ortho-aux:
    build: .
    container_name: ortho-aux
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8000
      - ORTHO_AUX_DB=/app/data/ortho_aux.sqlite3
      - ORTHO_ENV=development
      - ORTHO_ALLOWED_DATA_CLASSIFICATIONS=synthetic
      - ORTHO_DATA_RETENTION_HOURS=168
