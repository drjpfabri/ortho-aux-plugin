databases:
  - name: ortho-aux-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"

services:
  - type: web
    name: ortho-aux-plugin
    runtime: python
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ortho-aux-db
          property: connectionString
      - key: ORTHO_API_KEY
        sync: false
      - key: ORTHO_ENV
        value: production
      - key: ORTHO_ALLOWED_DATA_CLASSIFICATIONS
        value: synthetic
      - key: ORTHO_DATA_RETENTION_HOURS
        value: "168"
      - key: PYTHON_VERSION
        value: 3.12.13
